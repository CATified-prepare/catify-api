spring:
  application:
    name: catify-api
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catify}
    username: ${SPRING_DATASOURCE_USERNAME:catify}
    password: ${SPRING_DATASOURCE_PASSWORD:catify}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # leave blank if no password
      timeout: 2000ms

  ai:
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        use-tls: ${QDRANT_USE_TLS:false}
        api-key: ${QDRANT_API_KEY:}            # empty locally, required in prod
        collection-name: ${QDRANT_COLLECTION:cat-questions}
        initialize-schema: true

    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}   # used by chat autoconfig
        chat:
          model: gemini-3.1-flash-lite
          temperature: 0.3
        embedding:
          api-key: ${GEMINI_API_KEY} # must be set separately — embedding has its own connection properties
          model: gemini-embedding-002
management:
  endpoint:
    health:
      show-details: always    # shows all components + details without auth
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus