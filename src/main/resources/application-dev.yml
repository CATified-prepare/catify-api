spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}   # used by chat autoconfig
        chat:
          model: gemini-3.1-flash-lite
          temperature: 0.3
        embedding:
          api-key: ${GEMINI_API_KEY} # must be set separately — embedding has its own connection properties
          model: gemini-embedding-002
